name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ccplatform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ccplatform_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Type check
        working-directory: app
        run: npm run typecheck

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Run migrations
        working-directory: app
        run: npm run migrate

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build

      - name: Health endpoint smoke test
        working-directory: app
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            sleep 1
            if curl -sf http://localhost:3000/api/health; then
              kill $SERVER_PID
              exit 0
            fi
          done
          kill $SERVER_PID
          echo "Health check failed after 10 attempts"
          exit 1
